<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders | Grab & Go</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#171513;--muted:#77716b;--line:#e8e2db;--bg:#faf8f5;--accent:#c9542c}body{font-family:Inter,sans-serif;background:var(--bg);color:var(--ink)}header{height:82px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo,h1,h2{font-family:Fraunces,Georgia,serif}.logo{font-size:25px;font-weight:700;color:var(--ink);text-decoration:none}.logo small{display:block;font:600 10px Inter,sans-serif;letter-spacing:2px;color:var(--muted);margin-top:3px}nav{display:flex;gap:24px}nav a{color:var(--ink);font-size:14px;font-weight:700;text-decoration:none}main{max-width:950px;margin:auto;padding:65px 25px 100px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:13px}h1{font-size:52px}.intro{color:var(--muted);margin-top:10px}.card,.empty{margin-top:32px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px}.top,.item{display:flex;justify-content:space-between;gap:18px}.top{padding-bottom:22px;border-bottom:1px solid var(--line)}.id{font-weight:800;font-size:18px}.date,.payment{font-size:12px;color:var(--muted);margin-top:6px}.status{background:#eeeae4;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:32px 0 22px}.step{text-align:center}.dot{width:34px;height:34px;margin:auto;display:grid;place-items:center;border-radius:50%;background:#e4ded6;font-weight:800}.done .dot{background:var(--accent);color:#fff}.active .dot{background:var(--ink);color:#fff}.step strong{display:block;font-size:12px;margin-top:9px}.step span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.items{border-top:1px solid var(--line);padding-top:18px}.items h2{font-size:21px;margin-bottom:8px}.item{padding:10px 0;font-size:14px}.empty{color:var(--muted)}.empty a{color:var(--ink);font-weight:800}@media(max-width:650px){header{padding:0 5%}h1{font-size:40px}.progress{grid-template-columns:1fr 1fr}}
</style></head><body><header><a class="logo" href="index.html">Grab & Go<small>SMART CANTEEN</small></a><nav><a href="menu.html">Menu</a><a data-account-link href="login.html">Log in</a><a href="index.html">Home</a></nav></header><main><div class="eyebrow">Live order tracking</div><h1>My Orders</h1><p class="intro">Follow your meal from order received to pickup.</p><div id="content"></div></main><script src="auth.js"></script><script>
const content=document.getElementById('content'),labels=['Order received','Preparing','Packing','Ready for pickup'],details=['We received your order','The kitchen is preparing your food','Your meal is being packed','Come to the pickup point'];function statusFor(order){const elapsed=Date.now()-order.createdAt;return elapsed>18000?3:elapsed>9000?2:elapsed>3000?1:0}function render(){if(!getCurrentUser()){content.innerHTML='<div class="empty">Log in to view the orders saved to your prototype account.<br><br><a href="login.html?next=orders.html">Log in →</a></div>';return}const orders=JSON.parse(localStorage.getItem(accountOrdersKey())||'[]');if(!orders.length){content.innerHTML='<div class="empty">You don’t have an order yet.<br><br><a href="menu.html">Browse the menu →</a></div>';return}content.innerHTML=orders.map(order=>{const status=statusFor(order),rows=(order.items||[]).map(item=>`<div class="item"><span>${item.name}${item.quantity>1?` × ${item.quantity}`:''}</span><strong>₹${item.price*(item.quantity||1)}</strong></div>`).join('');return `<article class="card"><div class="top"><div><div class="id">Order #${order.id}</div><div class="date">${new Date(order.createdAt).toLocaleString()}</div><div class="payment">Payment: ${order.payment||'Not recorded'}</div></div><div class="status">${labels[status]}</div></div><div class="progress">${labels.map((label,index)=>`<div class="step ${index<status?'done':''} ${index===status?'active':''}"><div class="dot">${index<status?'✓':index+1}</div><strong>${label}</strong><span>${details[index]}</span></div>`).join('')}</div><div class="items"><h2>Your items</h2>${rows}</div></article>`}).join('')}render();setInterval(render,1500);
</script></body></html>
