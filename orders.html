<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders | Grab & Go</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#171513;--muted:#77716b;--line:#e8e2db;--bg:#faf8f5;--accent:#c9542c}body{font-family:Inter,sans-serif;background:var(--bg);color:var(--ink)}header{height:82px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo,h1,h2{font-family:Fraunces,serif}.logo{font-size:25px;font-weight:700;color:var(--ink);text-decoration:none}.logo small{display:block;font:600 10px Inter,sans-serif;letter-spacing:2px;color:var(--muted)}nav{display:flex;gap:24px}nav a{color:var(--ink);font-size:14px;font-weight:700;text-decoration:none}main{max-width:950px;margin:auto;padding:65px 25px 100px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:13px}h1{font-size:52px}.intro{color:var(--muted);margin-top:10px}.card,.empty{margin-top:32px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px}.top,.item{display:flex;justify-content:space-between;gap:18px}.top{border-bottom:1px solid var(--line);padding-bottom:20px}.id{font-size:18px;font-weight:800}.date{font-size:12px;color:var(--muted);margin-top:6px}.status{background:#eeeae4;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800}.items{padding-top:18px}.items h2{font-size:21px;margin-bottom:8px}.item{padding:10px 0;font-size:14px}.empty{color:var(--muted)}.empty a{color:var(--ink);font-weight:800}
/* Mobile-first layout refinements */
img{max-width:100%}
button,a{-webkit-tap-highlight-color:transparent}
a,button{touch-action:manipulation}
main,.container{width:100%;min-width:0}
input,select,textarea{max-width:100%;font:inherit}
.mobile-menu-btn{display:none}
@media(max-width:700px){
  header{height:auto!important;min-height:68px;padding:12px 16px!important;gap:10px;flex-wrap:wrap}
  .logo{font-size:22px!important;line-height:1.05;white-space:nowrap}
  .logo small{font-size:8px!important;letter-spacing:1.6px!important}
  header nav,.header-right{display:flex;align-items:center;gap:7px!important;flex-wrap:wrap}
  header nav a,.header-right a{font-size:12px!important}
  .orders{padding:9px 11px!important}
  .cart,.cart-button{padding:10px 12px!important;font-size:12px!important}
  .mobile-menu-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;background:#c9542c;color:#fff;border-radius:999px;padding:10px 13px;font-size:13px;font-weight:800}
  body{overflow-x:hidden}
  h1{font-size:clamp(34px,9vw,46px)!important;line-height:1.06!important;letter-spacing:-1px!important}
  h2{line-height:1.15}
  .hero{grid-template-columns:1fr!important;gap:25px!important;padding:34px 18px 28px!important}
  .hero p{font-size:14px!important;line-height:1.7!important}
  .hero-art{min-height:250px!important}
  .hero-card{border-radius:22px!important}
  .hero-label{left:16px!important;right:16px!important;bottom:16px!important;gap:10px}
  .hero-label strong{font-size:17px!important}
  .quick,.orders-preview{padding:18px 16px 36px!important}
  .quick-title{font-size:25px!important}
  .quick-grid{grid-template-columns:1fr!important;gap:12px!important}
  .quick-card{padding:19px!important;border-radius:18px!important}
  .order-box,.empty-order{padding:21px!important;border-radius:20px!important;gap:16px!important}
  footer{padding:22px 16px!important}
  .container{padding:24px 16px!important}
  .intro{padding:30px 18px 18px!important}
  .checkout-grid{grid-template-columns:1fr!important;gap:16px!important}
  .cart-box,.box,.card{width:100%;min-width:0;border-radius:18px!important}
  .cart-box{padding:18px!important}
  .actions{flex-wrap:wrap;gap:10px!important}
  .actions a,.actions button,.pay-button,.view-orders{min-height:44px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important}
  .food-image{height:auto!important;aspect-ratio:1/1;object-fit:cover}
  .card{overflow:hidden}
  .categories{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;padding-bottom:8px;max-width:100%;scrollbar-width:thin}
  .category{flex:0 0 auto}
  .menu-section{padding-left:16px!important;padding-right:16px!important}
  .cart-panel{width:100%!important;max-width:100vw!important}
  .cart-item,.cart-item-details{min-width:0}
  .cart-item-name,.item-name{overflow-wrap:anywhere}
  .items,.item{min-width:0}
  .total,.total-row{gap:10px}
  .payment-option{padding:13px!important}
  .token{overflow-wrap:anywhere}
}
@media(max-width:390px){
  header{padding:10px 12px!important;gap:8px}
  .logo{font-size:20px!important}
  .mobile-menu-btn{padding:9px 10px;font-size:12px}
  header nav,.header-right{gap:5px!important}
  .orders{padding:8px 9px!important}
  .grid{grid-template-columns:1fr!important}
  .hero-art{min-height:220px!important}
}

</style></head><body><header><a class="logo" href="index.html">Grab & Go<small>SMART CANTEEN</small></a><nav><a href="menu.html">Menu</a><a data-account-link href="login.html">Log in</a><a href="index.html">Home</a></nav></header><main><div class="eyebrow">Prototype order tracking</div><h1>My Orders</h1><p class="intro">Orders are available only during this browser tab session.</p><div id="content"></div></main><script src="auth.js"></script><script>const content=document.getElementById('content');function render(){if(!getCurrentUser()){content.innerHTML='<div class="empty">Start a session to view your orders.<br><br><a href="login.html?next=orders.html">Start session →</a></div>';return}const orders=JSON.parse(sessionStorage.getItem(accountOrdersKey())||'[]');if(!orders.length){content.innerHTML='<div class="empty">You don’t have an order yet.<br><br><a href="menu.html">Browse the menu →</a></div>';return}content.innerHTML=orders.map(order=>{const seconds=(Date.now()-order.createdAt)/1000,status=seconds>18?'Ready for pickup':seconds>9?'Packing':seconds>3?'Preparing':'Order received',items=(order.items||[]).map(item=>`<div class="item"><span>${item.name}${item.quantity>1?` × ${item.quantity}`:''}</span><strong>₹${item.price*(item.quantity||1)}</strong></div>`).join('');return `<article class="card"><div class="top"><div><div class="id">Order #${order.id}</div><div class="date">${new Date(order.createdAt).toLocaleString()}</div></div><div class="status">${status}</div></div><div class="items"><h2>Your items</h2>${items}</div></article>`}).join('')}render();setInterval(render,1500)</script></body></html>
