<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Grab & Go | My Orders</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#171513;--muted:#77716b;--line:#e8e2db;--bg:#faf8f5;--accent:#c9542c}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}h1,h2,.logo{font-family:Fraunces,Georgia,serif}header{height:82px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;background:rgba(250,248,245,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.logo{font-size:25px;font-weight:700;text-decoration:none;color:var(--ink)}.logo small{display:block;font:600 10px Inter,sans-serif;letter-spacing:2px;color:var(--muted);margin-top:3px}nav{display:flex;gap:24px}nav a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:650}main{max-width:950px;margin:auto;padding:65px 25px 110px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:13px}h1{font-size:52px;letter-spacing:-1px}.intro{color:var(--muted);margin-top:10px;font-size:15px}.order-card{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 20px 50px rgba(30,20,10,.06)}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:22px}.id{font-weight:800;font-size:18px}.date,.payment{font-size:12px;color:var(--muted);margin-top:6px}.status{background:#eeeae4;padding:9px 13px;border-radius:999px;font-size:12px;font-weight:800}.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:scale(1.8);opacity:.45}}.progress{display:grid;grid-template-columns:repeat(4,1fr);margin:42px 0 24px;position:relative}.progress:before{content:'';position:absolute;top:18px;left:10%;right:10%;height:3px;background:#e4ded6}.step{position:relative;text-align:center;z-index:1}.dot{width:36px;height:36px;margin:auto;border-radius:50%;background:#e4ded6;display:grid;place-items:center;font-size:13px;font-weight:800}.step.active .dot{background:var(--ink);color:#fff;box-shadow:0 0 0 7px #eeeae4}.step.done .dot{background:var(--accent);color:#fff}.step strong{display:block;font-size:12px;margin-top:11px}.step span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.items{margin-top:25px;padding-top:20px;border-top:1px solid var(--line)}.items h2{font-size:21px;margin-bottom:12px}.item{display:flex;justify-content:space-between;padding:10px 0;font-size:14px}.empty{margin-top:35px;background:#fff;border:1px solid var(--line);border-radius:25px;padding:35px;color:var(--muted)}.empty a{color:var(--ink);font-weight:800}@media(max-width:650px){h1{font-size:40px}.progress{grid-template-columns:1fr 1fr;gap:25px}.progress:before{display:none}}
</style></head><body><header><a class="logo" href="index.html">Grab & Go<small>SMART CANTEEN</small></a><nav><a href="menu.html">Menu</a><a href="index.html">Home</a></nav></header><main><div class="eyebrow">Live order tracking</div><h1>My Orders</h1><p class="intro">Follow your meal from order received to pickup.</p><div id="content"></div></main><script>
const content=document.getElementById('content');
const labels=['Order received','Preparing','Packing','Ready for pickup'];
const details=['We received your order','The kitchen is preparing your food','Your meal is being packed','Come to the pickup point'];
function statusFor(order){const elapsed=Date.now()-order.createdAt;return elapsed>18000?3:elapsed>9000?2:elapsed>3000?1:0}
function render(){let orders=JSON.parse(localStorage.getItem('grabGoOrders')||'[]');if(!orders.length){const legacy=JSON.parse(localStorage.getItem('grabGoOrder')||'null');if(legacy)orders=[legacy]}if(!orders.length){content.innerHTML='<div class="empty">You don’t have an order yet.<br><br><a href="menu.html">Browse the menu →</a></div>';return}content.innerHTML=orders.map(order=>{const status=statusFor(order);const itemRows=(order.items||[]).map(item=>`<div class="item"><span>${item.name}${item.quantity>1?` × ${item.quantity}`:''}</span><strong>₹${item.price*(item.quantity||1)}</strong></div>`).join('');return `<article class="order-card"><div class="top"><div><div class="id">Order #${order.id}</div><div class="date">${new Date(order.createdAt).toLocaleString()}</div><div class="payment">Payment: ${order.payment||'Not recorded'}</div></div><div class="status"><span class="pulse"></span>${labels[status]}</div></div><div class="progress">${labels.map((label,index)=>`<div class="step ${index<status?'done':''} ${index===status?'active':''}"><div class="dot">${index<status?'✓':index+1}</div><strong>${label}</strong><span>${details[index]}</span></div>`).join('')}</div><div class="items"><h2>Your items</h2>${itemRows}</div></article>`}).join('')}
render();setInterval(render,1500);
</script></body></html>
