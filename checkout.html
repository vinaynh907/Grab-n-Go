<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grab & Go | Checkout</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f7f7;
    color:#171717;
}

header{
    height:82px;
    background:white;
    border-bottom:1px solid #e5e5e5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
}

.logo{
    font-size:26px;
    font-weight:800;
}

.logo small{
    display:block;
    font-size:11px;
    letter-spacing:1.5px;
    color:#777;
}

main{
    max-width:750px;
    margin:auto;
    padding:60px 25px;
}

.back{
    border:0;
    background:none;
    cursor:pointer;
    margin-bottom:30px;
    font-size:15px;
}

h1{
    font-size:40px;
    margin-bottom:10px;
}

.subtitle{
    color:#777;
    margin-bottom:35px;
}

.box{
    background:white;
    border:1px solid #e5e5e5;
    border-radius:20px;
    padding:25px;
    margin-bottom:20px;
}

.box h2{
    margin-bottom:20px;
}

.item{
    display:flex;
    justify-content:space-between;
    padding:15px 0;
    border-bottom:1px solid #eee;
}

.total{
    display:flex;
    justify-content:space-between;
    font-size:21px;
    font-weight:800;
    margin-top:20px;
}

.continue{
    width:100%;
    padding:16px;
    border:0;
    border-radius:13px;
    background:#171717;
    color:white;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
}

</style>
</head>

<body>

<header>

<div class="logo">
Grab & Go
<small>SMART CANTEEN</small>
</div>

</header>

<main>

<button class="back" onclick="history.back()">← Back to Menu</button>

<h1>Checkout</h1>

<p class="subtitle">
Review your order before continuing.
</p>

<div class="box">

<h2>Your Order</h2>

<div id="items"></div>

<div class="total">
<span>Total</span>
<span>₹<span id="total">0</span></span>
</div>

</div>

<div class="box">

<h2>Pickup</h2>

<p>
📍 College Canteen
</p>

<br>

<p>
Your food will be prepared and you'll receive a digital token after payment.
</p>

</div>

<button class="continue" onclick="continueToPayment()">
Continue to Payment →
</button>

</main>

<script>

const cart =
JSON.parse(localStorage.getItem("grabGoCart")) || [];

const items=document.getElementById("items");

let total=0;

cart.forEach(item=>{

total+=item.price;

const div=document.createElement("div");

div.className="item";

div.innerHTML=`
<span>${item.name}</span>
<strong>₹${item.price}</strong>
`;

items.appendChild(div);

});

document.getElementById("total").textContent=total;

function continueToPayment(){

alert("Payment page coming next!");

}

</script>

</body>
</html>
