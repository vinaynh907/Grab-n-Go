<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Log in | Grab & Go</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#171513;--muted:#77716b;--line:#e8e2db;--bg:#faf8f5;--accent:#c9542c}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}header{height:82px;padding:0 7%;display:flex;align-items:center;border-bottom:1px solid var(--line)}.logo{font:700 25px Fraunces,Georgia,serif;color:var(--ink);text-decoration:none}.logo small{display:block;font:600 10px Inter,sans-serif;letter-spacing:2px;color:var(--muted);margin-top:3px}.wrap{max-width:470px;margin:0 auto;padding:76px 25px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:13px}h1{font:700 46px/1.05 Fraunces,Georgia,serif;letter-spacing:-1px}.intro{color:var(--muted);line-height:1.6;margin:12px 0 30px}.card{background:#fff;border:1px solid var(--line);border-radius:25px;padding:27px}label{display:block;font-size:13px;font-weight:800;margin:18px 0 8px}input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:15px Inter,sans-serif}input:focus{outline:2px solid #e9c7bb;border-color:var(--accent)}button{width:100%;border:0;background:var(--ink);color:#fff;border-radius:14px;padding:15px;margin-top:24px;font:800 15px Inter,sans-serif;cursor:pointer}.note{font-size:12px;line-height:1.55;color:var(--muted);margin-top:17px}.mode{margin-top:19px;text-align:center;font-size:13px}.mode button{display:inline;width:auto;background:none;color:var(--ink);padding:0;margin:0;text-decoration:underline;font-size:13px}.error{display:none;background:#fff1ec;color:#9d3718;border-radius:10px;padding:11px 12px;font-size:13px;margin-top:16px}
</style></head><body><header><a class="logo" href="index.html">Grab & Go<small>SMART CANTEEN</small></a></header><main class="wrap"><div class="eyebrow">Prototype account</div><h1 id="title">Welcome back</h1><p class="intro" id="intro">Log in to see your profile and keep your orders together on this browser.</p><section class="card"><form id="authForm"><div id="nameField" hidden><label for="name">Name</label><input id="name" autocomplete="name" placeholder="Your name"></div><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="4" placeholder="At least 4 characters" required><div class="error" id="error"></div><button type="submit" id="submit">Log in</button></form><div class="mode"><span id="modeText">New here?</span> <button type="button" id="switchMode">Create an account</button></div><p class="note">Prototype only: details are saved in this browser and are not a secure account system.</p></section></main><script>
let signup=false;const form=document.getElementById('authForm'),nameField=document.getElementById('nameField'),title=document.getElementById('title'),intro=document.getElementById('intro'),submit=document.getElementById('submit'),modeText=document.getElementById('modeText'),switchMode=document.getElementById('switchMode'),error=document.getElementById('error');function setMode(){nameField.hidden=!signup;title.textContent=signup?'Create your account':'Welcome back';intro.textContent=signup?'Set up your prototype account to keep your orders together on this browser.':'Log in to see your profile and keep your orders together on this browser.';submit.textContent=signup?'Create account':'Log in';modeText.textContent=signup?'Already have an account?':'New here?';switchMode.textContent=signup?'Log in':'Create an account';document.getElementById('password').autocomplete=signup?'new-password':'current-password';error.style.display='none'}switchMode.addEventListener('click',()=>{signup=!signup;setMode()});form.addEventListener('submit',event=>{event.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value,users=JSON.parse(localStorage.getItem('grabGoUsers')||'{}');if(signup){const name=document.getElementById('name').value.trim();if(!name){error.textContent='Please enter your name.';error.style.display='block';return}if(users[email]){error.textContent='An account with this email already exists. Try logging in.';error.style.display='block';return}users[email]={name,email,password};localStorage.setItem('grabGoUsers',JSON.stringify(users))}const user=users[email];if(!user||user.password!==password){error.textContent='Incorrect email or password.';error.style.display='block';return}localStorage.setItem('grabGoUser',JSON.stringify({name:user.name,email:user.email}));window.location.href=new URLSearchParams(location.search).get('next')||'account.html'});setMode();
</script></body></html>
