<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Start session | Grab & Go</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#171513;--muted:#77716b;--line:#e8e2db;--bg:#faf8f5;--accent:#c9542c}body{font-family:Inter,sans-serif;background:var(--bg);color:var(--ink)}header{height:82px;padding:0 7%;display:flex;align-items:center;border-bottom:1px solid var(--line)}.logo{font:700 25px Fraunces,serif;color:var(--ink);text-decoration:none}.logo small{display:block;font:600 10px Inter,sans-serif;letter-spacing:2px;color:var(--muted)}main{max-width:470px;margin:auto;padding:76px 25px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:13px}h1{font:700 46px/1.05 Fraunces,serif}.intro{color:var(--muted);line-height:1.6;margin:14px 0 30px}.card{background:#fff;border:1px solid var(--line);border-radius:25px;padding:27px}label{display:block;font-size:13px;font-weight:800;margin:18px 0 8px}input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:15px Inter,sans-serif}button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:24px;background:var(--ink);color:#fff;font:800 15px Inter,sans-serif;cursor:pointer}.note{font-size:12px;line-height:1.55;color:var(--muted);margin-top:17px}</style></head><body><header><a class="logo" href="index.html">Grab & Go<small>SMART CANTEEN</small></a></header><main><div class="eyebrow">Prototype session</div><h1>Start ordering</h1><p class="intro">Enter a display name to use this demo. Nothing is kept after you close this tab.</p><section class="card"><form id="form"><label for="name">Display name</label><input id="name" autocomplete="name" placeholder="Your name" required><label for="email">Email (optional)</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><button>Continue</button></form><p class="note">This is not an official account or secure login. The session and its orders are automatically cleared when the tab closes.</p></section></main><script>document.getElementById('form').addEventListener('submit',event=>{event.preventDefault();const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim().toLowerCase()||`guest-${Date.now()}@local`;sessionStorage.setItem('grabGoUser',JSON.stringify({name,email}));location.href=new URLSearchParams(location.search).get('next')||'account.html'})</script></body></html>
