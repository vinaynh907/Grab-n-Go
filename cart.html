<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart | Grab & Go</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#171513;--muted:#77716b;--line:#e8e2db;--bg:#faf8f5;--accent:#c9542c}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}h1,h2,.logo{font-family:Fraunces,Georgia,serif}header{height:82px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;background:rgba(250,248,245,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.logo{font-size:25px;font-weight:700;text-decoration:none;color:var(--ink)}.logo small{display:block;font:600 10px Inter,sans-serif;letter-spacing:2px;color:var(--muted);margin-top:3px}nav{display:flex;gap:24px;align-items:center}nav a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:650}.orders{border:1px solid var(--ink);padding:11px 17px;border-radius:999px}main{max-width:850px;margin:auto;padding:64px 25px 90px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:13px}h1{font-size:52px;letter-spacing:-1px;margin-bottom:10px}.intro{color:var(--muted);line-height:1.6}.cart-box{margin-top:36px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 20px 50px rgba(30,20,10,.06)}.cart-item{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid var(--line)}.cart-item:last-child{border-bottom:0}.item-name{font-weight:800}.item-price{font-size:13px;color:var(--muted);margin-top:5px}.controls{display:flex;align-items:center;gap:12px}.quantity-button{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--ink);font-size:17px;font-weight:800;cursor:pointer}.quantity-button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}.quantity{font-weight:800;min-width:15px;text-align:center}.remove{border:0;background:transparent;color:var(--accent);font:700 12px Inter,sans-serif;cursor:pointer;margin-top:6px}.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:22px;padding-top:22px;font-size:19px;font-weight:800}.actions{display:flex;gap:14px;margin-top:25px}.button{display:inline-block;border:0;border-radius:999px;padding:14px 21px;font:800 14px Inter,sans-serif;text-decoration:none;cursor:pointer}.primary{background:var(--ink);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.empty{text-align:center;padding:40px 10px;color:var(--muted)}.empty h2{font-size:28px;color:var(--ink);margin-bottom:10px}.empty .button{margin-top:22px}@media(max-width:600px){header{padding:0 5%}nav a:first-child{display:none}h1{font-size:40px}.cart-box{padding:20px}.cart-item{align-items:flex-start}.actions{flex-direction:column}.button{text-align:center}}
</style>
</head>
<body>
<header><a class="logo" href="index.html">Grab & Go<small>SMART CANTEEN</small></a><nav><a href="menu.html">Menu</a><a data-account-link href="login.html">Log in</a><a class="orders" href="orders.html">My Orders</a></nav></header>
<main><div class="eyebrow">Ready when you are</div><h1>Your Cart</h1><p class="intro">Review your meal before sending it to the canteen.</p><section class="cart-box" id="cartContent"></section></main>
<script src="auth.js"></script><script>
let cart=JSON.parse(localStorage.getItem('grabGoCart')||'[]');
cart=cart.reduce((items,item)=>{const existing=items.find(entry=>entry.name===item.name&&entry.price===item.price);if(existing)existing.quantity+=item.quantity||1;else items.push({name:item.name,price:Number(item.price),quantity:item.quantity||1});return items},[]);
const content=document.getElementById('cartContent');
function save(){localStorage.setItem('grabGoCart',JSON.stringify(cart))}
function render(){if(!cart.length){content.innerHTML='<div class="empty"><h2>Your cart is empty</h2><p>Add something tasty from today’s menu.</p><a class="button primary" href="menu.html">Browse the menu →</a></div>';return}let total=0;const rows=cart.map((item,index)=>{total+=item.price*item.quantity;return `<div class="cart-item"><div><div class="item-name">${item.name}</div><div class="item-price">₹${item.price} each</div></div><div><div class="controls"><button class="quantity-button" onclick="changeQuantity(${index},-1)" aria-label="Remove one ${item.name}">−</button><span class="quantity">${item.quantity}</span><button class="quantity-button" onclick="changeQuantity(${index},1)" aria-label="Add one ${item.name}">+</button></div><button class="remove" onclick="removeItem(${index})">Remove</button></div></div>`}).join('');content.innerHTML=`${rows}<div class="total"><span>Total</span><span>₹${total}</span></div><div class="actions"><a class="button secondary" href="menu.html">← Continue shopping</a><a class="button primary" href="checkout.html">Proceed to checkout →</a></div>`}
function changeQuantity(index,amount){cart[index].quantity+=amount;if(cart[index].quantity<=0)cart.splice(index,1);save();render()}
function removeItem(index){cart.splice(index,1);save();render()}
save();render();
</script>
</body>
</html>
