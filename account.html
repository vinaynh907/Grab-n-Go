<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session | Grab & Go</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#171513;--muted:#77716b;--line:#e8e2db;--bg:#faf8f5;--accent:#c9542c}body{font-family:Inter,sans-serif;background:var(--bg);color:var(--ink)}header{height:82px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo,h1,h2{font-family:Fraunces,serif}.logo{font-size:25px;font-weight:700;color:var(--ink);text-decoration:none}.logo small{display:block;font:600 10px Inter,sans-serif;letter-spacing:2px;color:var(--muted)}nav{display:flex;gap:24px}nav a{color:var(--ink);font-size:14px;font-weight:700;text-decoration:none}main{max-width:800px;margin:auto;padding:65px 25px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:13px}h1{font-size:52px}.intro{color:var(--muted);margin-top:10px}.card{margin-top:32px;background:#fff;border:1px solid var(--line);border-radius:25px;padding:28px}.card h2{font-size:25px;margin-bottom:12px}.card p{line-height:1.6;color:var(--muted)}button{border:1px solid #eab5a4;border-radius:999px;padding:13px 19px;margin-top:22px;background:#fff;color:var(--accent);font:800 14px Inter,sans-serif;cursor:pointer}</style></head><body><header><a class="logo" href="index.html">Grab & Go<small>SMART CANTEEN</small></a><nav><a href="menu.html">Menu</a><a href="orders.html">My Orders</a></nav></header><main><div class="eyebrow">Prototype session</div><h1>Hi, <span id="name"></span></h1><p class="intro">Your session stays active only while this tab is open.</p><section class="card"><h2>Temporary session</h2><p>No permanent profile, password, or account data is saved. Closing the tab automatically removes this session and its prototype orders.</p><button id="end">End session now</button></section></main><script src="auth.js"></script><script>if(!requireUser('account.html')){}else{document.getElementById('name').textContent=getCurrentUser().name;document.getElementById('end').onclick=()=>{sessionStorage.clear();location.href='index.html'}}</script></body></html>
