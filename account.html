<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Account | Grab & Go</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}:root{--ink:#171513;--muted:#77716b;--line:#e8e2db;--bg:#faf8f5;--accent:#c9542c}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}h1,h2,.logo{font-family:Fraunces,Georgia,serif}header{height:82px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font-size:25px;font-weight:700;text-decoration:none;color:var(--ink)}.logo small{display:block;font:600 10px Inter,sans-serif;letter-spacing:2px;color:var(--muted);margin-top:3px}nav{display:flex;gap:23px}nav a{font-size:14px;font-weight:700;color:var(--ink);text-decoration:none}main{max-width:800px;margin:auto;padding:65px 25px 100px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:13px}h1{font-size:52px}.intro{color:var(--muted);margin-top:10px}.card{margin-top:32px;background:#fff;border:1px solid var(--line);border-radius:25px;padding:28px}.card h2{font-size:25px;margin-bottom:20px}label{display:block;font-size:13px;font-weight:800;margin:18px 0 8px}input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:15px Inter,sans-serif}.email{color:var(--muted);font-size:14px;background:#f6f3ee;border-radius:12px;padding:13px 14px}.actions{display:flex;gap:12px;margin-top:24px}.button{border:0;border-radius:999px;padding:13px 19px;font:800 14px Inter,sans-serif;cursor:pointer}.save{background:var(--ink);color:#fff}.logout{background:#fff;color:var(--accent);border:1px solid #eab5a4}.success{display:none;color:#267443;font-size:13px;font-weight:700;margin-top:14px}@media(max-width:600px){header{padding:0 5%}h1{font-size:40px}}
</style></head><body><header><a class="logo" href="index.html">Grab & Go<small>SMART CANTEEN</small></a><nav><a href="menu.html">Menu</a><a href="orders.html">My Orders</a></nav></header><main><div class="eyebrow">Prototype account</div><h1>Account Settings</h1><p class="intro">Manage the details saved in this browser.</p><section class="card"><h2>Your profile</h2><form id="profileForm"><label for="name">Name</label><input id="name" autocomplete="name" required><label>Email</label><div class="email" id="email"></div><div class="actions"><button class="button save" type="submit">Save changes</button><button class="button logout" type="button" id="logout">Log out</button></div><p class="success" id="success">Profile saved.</p></form></section></main><script src="auth.js"></script><script>if(!requireUser('account.html')){}else{const user=getCurrentUser(),name=document.getElementById('name'),email=document.getElementById('email'),success=document.getElementById('success');name.value=user.name;email.textContent=user.email;document.getElementById('profileForm').addEventListener('submit',event=>{event.preventDefault();const users=JSON.parse(localStorage.getItem('grabGoUsers')||'{}');users[user.email].name=name.value.trim();localStorage.setItem('grabGoUsers',JSON.stringify(users));localStorage.setItem('grabGoUser',JSON.stringify({name:name.value.trim(),email:user.email}));success.style.display='block'});document.getElementById('logout').addEventListener('click',()=>{localStorage.removeItem('grabGoUser');window.location.href='index.html'})}</script></body></html>
